name: Deploy site (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID ausentes — build OK, deploy pulado."
            exit 0
          fi
          # nome/variáveis via CLI pra não alterar o wrangler.jsonc que o Lovable usa (até migrar o DNS)
          bunx wrangler@4 deploy --name bodyoga --var SUPABASE_URL:https://rjksutoohsvwqnqlemjv.supabase.co

      - name: Secrets do Worker (Supabase)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Sem secrets de Supabase/Cloudflare — pulando."; exit 0
          fi
          node -e 'process.stdout.write(JSON.stringify({SUPABASE_SERVICE_ROLE_KEY:process.env.SUPABASE_SERVICE_ROLE_KEY,SUPABASE_PUBLISHABLE_KEY:process.env.SUPABASE_PUBLISHABLE_KEY}))' > /tmp/worker-secrets.json
          bunx wrangler@4 secret bulk /tmp/worker-secrets.json --name bodyoga
          rm -f /tmp/worker-secrets.json
