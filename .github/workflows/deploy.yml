name: Deploy (Cloudflare Workers)

# A cada push na main: build no formato Cloudflare e publica o Worker "bodyoga".
# Requer os secrets do repositório CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
# Sem eles, só valida o build (não publica).
on:
  push:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Build (Cloudflare)
        env:
          NITRO_PRESET: cloudflare_module
        run: bun run build
      - name: Publicar no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "⚠️ Sem CLOUDFLARE_API_TOKEN: build validado, deploy pulado."; exit 0; fi
          set +e
          bun x --bun wrangler@4 whoami 2>&1 | tail -15 | sed 's/^/[whoami] /'
          bun x --bun wrangler@4 deploy --name bodyoga --var SUPABASE_URL:https://rjksutoohsvwqnqlemjv.supabase.co > deploy.log 2>&1
          rc=$?
          cat deploy.log
          if [ $rc -ne 0 ]; then
            # Mostra o erro como anotação (visível sem login no GitHub).
            grep -iE "error|✘|code:|authentication|permission|account" deploy.log | grep -v "^\s*$" | tail -12 | while IFS= read -r l; do echo "::error::$l"; done
            exit $rc
          fi
      - name: Conferir publicação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          sleep 10
          code=$(curl -s -o /dev/null -w "%{http_code}" https://bodyoga.bodyoga.workers.dev/)
          echo "Página inicial: HTTP $code"
          [ "$code" = "200" ] || exit 1
          curl -sI https://bodyoga.bodyoga.workers.dev/ | grep -i "x-content-type-options" || (echo "cabeçalhos de segurança ausentes" && exit 1)
