name: Build de validação (Vercel)

# A Vercel builda e publica sozinha a cada push (integração GitHub).
# Este workflow só garante que o build no formato da Vercel continua passando.
on:
  push:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: build-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Build (preset Vercel)
        env:
          NITRO_PRESET: vercel
        run: bun run build
      - name: Conferir saída da Vercel
        run: |
          test -f .vercel/output/config.json && echo "✅ Build Output API gerado" || { echo "❌ sem .vercel/output"; ls -la; exit 1; }
          ls .vercel/output .vercel/output/functions | head -30
